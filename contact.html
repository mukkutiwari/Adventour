<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Contact — Adventour</title><link rel="stylesheet" href="./assets/css/style.css" /></head>
<body style="background: linear-gradient(180deg, #f8f6f2 0%, #fff 100%); min-height: 100vh;">
<nav class="site-nav" id="navbar">
  <a href="./index.html" class="logo-title">ADVENTOUR <span>by Muskan Tiwari</span></a>
  <ul class="nav-links"><li><a href="./index.html">Home</a></li><li><a href="./index.html#packages">Packages</a></li><li><a href="./index.html#locations">Locations</a></li><li><a href="./info.html">About</a></li><li><a href="./contact.html">Contact</a></li></ul>
</nav>
<header style="height: 45vh; background: linear-gradient(135deg, rgba(10,14,39,0.88) 0%, rgba(11,29,54,0.92) 100%), url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1600&q=80') center/cover no-repeat; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff;">
  <div style="position: relative; z-index: 2; padding: 0 24px;">
    <h1 style="font-family: 'Cinzel Decorative', serif; font-size: clamp(2.5rem, 7vw, 5rem); letter-spacing: 8px; text-shadow: 0 4px 30px rgba(212,175,55,0.35);">Contact Us</h1>
    <p style="color: rgba(255,255,255,0.85); max-width: 500px; margin: 12px auto 0; font-size: 1.1rem; font-weight: 300;">Reach out to Muskan Tiwari for bookings, questions, or travel ideas.</p>
  </div>
</header>
<section style="max-width: 700px; margin: -50px auto 80px; padding: 50px 30px; background: #fff; border-radius: 24px; box-shadow: 0 25px 60px rgba(10,14,39,0.08); position: relative; z-index: 3;">
  <form onsubmit="event.preventDefault(); this.innerHTML='<h3 style=\'text-align:center; font-family:Cinzel Decorative; color:var(--deep-navy);\'>Message Sent!</h3><p style=\'text-align:center; color:#555;\'>We will get back to you soon.</p>';" style="display: flex; flex-direction: column; gap: 16px;">
    <input type="text" placeholder="Your Name" required style="padding: 14px 18px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; outline: none; transition: .2s;" onfocus="this.style.borderColor='#d4af37'" />
    <input type="email" placeholder="Your Email" required style="padding: 14px 18px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; outline: none; transition: .2s;" onfocus="this.style.borderColor='#d4af37'" />
    <textarea placeholder="Your Message" rows="5" required style="padding: 14px 18px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; outline: none; resize: vertical; transition: .2s;" onfocus="this.style.borderColor='#d4af37'"></textarea>
    <button type="submit" style="padding: 14px 30px; background: var(--gold); color: var(--deep-navy); border: none; border-radius: 30px; font-weight: 700; font-family: inherit; cursor: pointer; transition: .3s; letter-spacing: .5px;">Send Message</button>
  </form>
</section>
<footer class="site-footer">
  <div class="footer-brand">ADVENTOUR <span>by Muskan Tiwari</span></div>
  <div class="end">Copyright &copy; 2024 Adventour by Muskan Tiwari. All Rights Reserved.</div>
</footer>
<script>
  const nav = document.getElementById('navbar');
  window.addEventListener('scroll', () => { if (window.scrollY > 60) nav.classList.add('scrolled'); else nav.classList.remove('scrolled'); });
</script>
</body>
</html>
